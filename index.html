<title>小小笔画魔法师</title>
<style>
:root{
  --bg:#ffffff; --card:#FAFBFF; --line:#EEF1F8; --ink:#4B4B5E; --sub:#9AA1B4;
  --c1:#FFC75A; --c1s:#FFF6E2;
  --c2:#6FCB9B; --c2s:#E7F7EF;
  --c3:#7FB2F0; --c3s:#E9F1FE;
  --c4:#FF9EC4; --c4s:#FFEDF5;
  --guide:#E6EAF4; --guideOn:#CBD4E6;
  --shadow:0 6px 18px rgba(120,130,170,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-weight:700; overflow:hidden; user-select:none; -webkit-user-select:none;
}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;}
.page{flex:1;min-height:0;display:flex;flex-direction:column;}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ---------- 通用头部 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 6px;}
.iconbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--card);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none;cursor:pointer;}
.iconbtn:active{transform:scale(.94);}
.topTitle{font-size:19px;letter-spacing:.5px;}
.starbox{margin-left:auto;display:flex;align-items:center;gap:6px;background:#FFF8E4;
  border-radius:22px;padding:8px 14px;font-size:17px;color:#E9A32B;box-shadow:var(--shadow);}

/* ---------- 首页 ---------- */
.hero{padding:10px 22px 4px;}
.hero h1{font-size:28px;margin:0 0 4px;letter-spacing:1px;}
.hero p{margin:0;font-size:14px;color:var(--sub);font-weight:600;}
.modlist{padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px;}
.modcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:30px;
  padding:14px 18px;box-shadow:var(--shadow);border:2px solid #fff;cursor:pointer;transition:.15s;}
.modcard:active{transform:scale(.98);}
.modcard .pet{width:78px;height:78px;flex:none;}
.modcard .mt{font-size:20px;margin:0 0 4px;}
.modcard .ms{font-size:13px;color:var(--sub);font-weight:600;}
.modcard.locked{filter:grayscale(.85);opacity:.6;}
.modcard .lock{font-size:13px;color:var(--sub);}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;background:#fff;color:var(--sub);}
.homefoot{text-align:center;padding:4px 0 18px;}
.linkbtn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;
  font-family:inherit;text-decoration:underline;cursor:pointer;padding:10px;}

/* ---------- 关卡网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 18px 24px;}
.lv{position:relative;aspect-ratio:1/1;border-radius:26px;border:none;background:var(--card);
  box-shadow:var(--shadow);font-family:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.lv .g{font-size:26px;line-height:1.1;}
.lv .n{font-size:11px;color:var(--sub);font-weight:600;}
.lv.done{background:#FFF6E0;}
.lv.cur{outline:3px solid #FFD97A;outline-offset:2px;}
.lv.lock{color:#C6CBD8;background:#F6F7FB;box-shadow:none;}
.lv .st{position:absolute;top:5px;right:7px;font-size:13px;}
.lv .lk{font-size:16px;}
.sect{padding:14px 20px 2px;font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px;}
.sect::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;}

/* ---------- 书写页 ---------- */
.writeHead{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;}
.lesson{flex:1;text-align:center;}
.lesson .big{font-size:24px;}
.lesson .sm{font-size:13px;color:var(--sub);font-weight:600;margin-top:2px;}
.dots{display:flex;justify-content:center;gap:7px;padding:2px 0 6px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--guide);}
.dot.on{background:var(--acc,#FFC75A);transform:scale(1.25);}
.dot.ok{background:var(--acc,#FFC75A);}
.tip{min-height:24px;text-align:center;font-size:15px;color:var(--sub);padding:0 24px 2px;font-weight:600;}
.boardWrap{flex:1;min-height:0;padding:6px 16px 0;display:flex;}
.board{position:relative;flex:1;background:var(--card);border-radius:34px;box-shadow:var(--shadow);
  border:2px solid var(--line);overflow:hidden;}
.board svg{width:100%;height:100%;display:block;touch-action:none;}
.pet-corner{position:absolute;right:8px;bottom:6px;width:86px;height:86px;pointer-events:none;}
.bubble{position:absolute;right:96px;bottom:44px;background:#fff;border-radius:16px;padding:7px 12px;
  font-size:13px;box-shadow:var(--shadow);color:var(--ink);max-width:52%;opacity:0;transition:.25s;}
.bubble.show{opacity:1;}
.foot{display:flex;gap:12px;padding:12px 16px 20px;}
.bigbtn{flex:1;height:66px;border-radius:26px;border:none;font-family:inherit;font-size:19px;font-weight:700;
  color:#fff;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.bigbtn:active{transform:scale(.97);}
.bigbtn.gray{background:#F0F2F8;color:var(--ink);}
.bigbtn.main{background:var(--acc,#FFC75A);}

/* ---------- 弹层 ---------- */
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:20;padding:24px;}
.overlay.hide{display:none;}
.win{background:#fff;border-radius:38px;box-shadow:0 12px 40px rgba(120,130,170,.18);
  padding:26px 26px 22px;text-align:center;width:100%;max-width:340px;border:3px solid var(--line);}
.win h2{margin:0 0 6px;font-size:24px;}
.win p{margin:0 0 14px;font-size:14px;color:var(--sub);font-weight:600;}
.win .stars{font-size:40px;letter-spacing:6px;margin:6px 0 10px;}
.win .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.win .btns{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.fly{position:absolute;font-size:30px;pointer-events:none;z-index:30;animation:fly 1s ease-out forwards;}
@keyframes fly{0%{transform:translateY(0) scale(.4);opacity:0}
 25%{transform:translateY(-30px) scale(1.3);opacity:1}
 100%{transform:translateY(-140px) scale(.7);opacity:0}}

/* ---------- 家长页 ---------- */
.pcard{background:var(--card);border-radius:26px;box-shadow:var(--shadow);margin:12px 18px;padding:18px;}
.pcard h3{margin:0 0 12px;font-size:17px;}
.stat{display:flex;gap:12px;}
.stat div{flex:1;background:#fff;border-radius:20px;padding:14px 8px;text-align:center;}
.stat b{display:block;font-size:26px;color:#E9A32B;}
.stat span{font-size:12px;color:var(--sub);}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.rec:last-child{border:none;}
.rec .t{color:var(--sub);font-size:12px;font-weight:600;margin-left:auto;}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0;}
.qbox{text-align:center;}
.qbox .q{font-size:26px;margin:8px 0 14px;}
.opts{display:flex;gap:10px;justify-content:center;}
.opt{width:64px;height:64px;border-radius:22px;border:2px solid var(--line);background:#fff;
  font-size:20px;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer;}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(60,60,80,.9);
  color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;bottom:112px;}
.toggleRow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0;font-size:14px;color:var(--sub);}
.sw{width:54px;height:30px;border-radius:15px;background:#E3E7F0;position:relative;cursor:pointer;transition:.2s;border:none;}
.sw.on{background:#A8D8BE;}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.15);}
.sw.on i{left:27px;}
</style>

function pyStage(str){
  const arr = [];
  for(const ch of str) arr.push(ch);
  const n = arr.length;
  const W = Math.max(100, 54*n + 26);
  const ox = (W - (54*n - 14))/2 - 10;
  const strokes = [];
  arr.forEach((ch,i)=>{
    (LOWER[ch]||[]).forEach(d=>strokes.push({d, ox: ox + i*54}));
  });
  return {label:str, w:10, vb:'0 0 '+W+' 100', strokes, say:PY_SOUND[str]||str};
}

function todayRec(){ const k=todayKey(); if(!SAVE.today[k]) SAVE.today[k]={stars:0, list:[]}; return SAVE.today[k]; }
function moduleDone(m){ return levelsOf(m).every(l=>SAVE.lv[l.id]&&SAVE.lv[l.id].done); }
function moduleProgress(m){ const ls=levelsOf(m); return ls.filter(l=>SAVE.lv[l.id]&&SAVE.lv[l.id].done).length+'/'+ls.length; }
function moduleUnlocked(mi){ if(mi===0) return true; return moduleDone(MODULES[mi-1].id); }
function levelUnlocked(l){
  const mi = MODULES.findIndex(m=>m.id===l.m);
  if(!moduleUnlocked(mi)) return false;
  const ls = levelsOf(l.m);
  if(l.idx===0) return true;
  const prev = ls[l.idx-1];
  return !!(SAVE.lv[prev.id] && SAVE.lv[prev.id].done);
}
function nextLevel(l){
  const ls = levelsOf(l.m);
  if(l.idx+1 < ls.length) return ls[l.idx+1];
  const mi = MODULES.findIndex(m=>m.id===l.m);
  if(mi+1 < MODULES.length) return levelsOf(MODULES[mi+1].id)[0];
  return null;
}

/* ---------------- 音频（音效 + 配乐，纯合成，无外部资源） ---------------- */
let AC=null;
function ac(){ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==='suspended') AC.resume(); return AC; }
let bgmGain=null, sfxGain=null, masterGain=null;
function ensureBus(){
  const c=ac(); if(!c) return null;
  if(!masterGain){
    masterGain=c.createGain(); masterGain.gain.value=0.9; masterGain.connect(c.destination);
    bgmGain=c.createGain(); bgmGain.gain.value=0.05; bgmGain.connect(masterGain);
    sfxGain=c.createGain(); sfxGain.gain.value=0.5;  sfxGain.connect(masterGain);
  }
  return c;
}
function tone(f, t0, dur, type, vol, bus){
  const c=ensureBus(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  const s=c.currentTime + (t0||0);
  g.gain.setValueAtTime(0.0001, s);
  g.gain.exponentialRampToValueAtTime(vol||0.18, s+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, s+dur);
  o.connect(g); g.connect(bus||sfxGain); o.start(s); o.stop(s+dur+0.02);
}
function noiseBurst(dur, vol){
  const c=ensureBus(); if(!c) return;
  const len=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,len,c.sampleRate), dat=buf.getChannelData(0);
  for(let i=0;i<len;i++) dat[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.8;
  const g=c.createGain(); g.gain.value=vol||0.05;
  src.connect(f); f.connect(g); g.connect(sfxGain); src.start();
}
/* 音效 */
const SFX = {

/* 配乐（每模块不同音阶，低音量循环） */
const SCALES = {
  pentatonic:[523,587,659,784,880,784,659,587],
  forest:[440,523,659,587,523,440,392,523],
  star:[659,784,880,1047,880,784,659,587],
  castle:[587,659,784,659,587,523,659,784],
  home:[523,659,784,659,587,523,440,523]
};
let bgmTimer=null, bgmIdx=0, audioReady=false, pendingBgm='home';
function bgmStart(kind){
  bgmStop();
  pendingBgm = kind;
  if(!audioReady || !SAVE.bgm) return;
  const seq = SCALES[kind]||SCALES.home;
  const step = kind==='star'?620:(kind==='forest'?720:520);
  bgmIdx=0;
  const play=()=>{
    const f=seq[bgmIdx%seq.length]; bgmIdx++;
    tone(f/2, 0, 0.9, 'sine', 0.35, bgmGain);
    tone(f, 0.02, 0.8, 'triangle', 0.14, bgmGain);
  };
  play(); bgmTimer=setInterval(play, step);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function duck(on){ if(bgmGain && ac()) bgmGain.gain.setTargetAtTime(on?0.012:0.05, ac().currentTime, 0.15); }

/* ---------------- 语音（浏览器 TTS） ---------------- */
let VOICES=[];
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices()||[]; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = lang||'zh-CN'; u.rate = lang==='en-US'?0.75:0.8; u.pitch=1.25; u.volume=1;
    const v = VOICES.find(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith((lang||'zh-CN').toLowerCase().slice(0,2)));
    if(v) u.voice=v;
    duck(true);
    u.onend=()=>duck(false); u.onerror=()=>duck(false);
    speechSynthesis.speak(u);
    setTimeout(()=>duck(false), 3200);
  }catch(e){}
}

/* ================= 关卡列表 ================= */
function renderLevels(mid){
  const m = MODULES.find(x=>x.id===mid);
  bgmStart(m.scale);
  const ls = levelsOf(mid);
  let lastGroup='';
  let body='';
  if(mid!=='m4') body += '<div class="grid">';
  ls.forEach(l=>{
    const un = levelUnlocked(l), dn = SAVE.lv[l.id]&&SAVE.lv[l.id].done;
    if(mid==='m4' && l.group!==lastGroup){
      if(lastGroup) body += '</div>';
      lastGroup = l.group;
      body += `<div class="sect">${l.group}</div><div class="grid">`;
    }
    const inner = un
      ? `<div class="g" style="font-size:${l.glyph.length>2?'18px':'26px'}">${l.glyph}</div><div class="n">${l.idx+1}</div>${dn?'<div class="st">⭐</div>':''}`
      : `<div class="lk">🔒</div>`;
    const cur = (!dn && un) ? ' cur':'';
    body += `<button class="lv ${dn?'done':''} ${un?'':'lock'}${cur}" data-id="${l.id}">${inner}</button>`;
  });
  body += '</div>';
  go(`<div class="page">
    <div class="topbar">
      <button class="iconbtn" id="back">‹</button>
      <div class="topTitle">${m.name}</div>
      <div class="starbox">${starSVG()}<span>${SAVE.stars}</span></div>
    </div>
    <div class="scroll" style="padding-top:6px">
      <div style="padding:0 20px 6px;font-size:14px;color:var(--sub)">已通关 ${moduleProgress(mid)}　·　点开一关开始写吧</div>
      ${body}
      <div style="height:20px"></div>
    </div>
  </div>`);
  document.getElementById('back').addEventListener('click',()=>{ SFX.click(); renderHome(); });
  app.querySelectorAll('.lv').forEach(el=>{
    el.addEventListener('click',()=>{
      ac(); const l=LV_BY_ID[el.dataset.id];
      if(el.classList.contains('lock')){ toast('先完成前面一关哦'); return; }
      SFX.click(); openWrite(l);
    });
  });
}

function playSound(){
  const l=W.l;
  let txt = l.title, lang='zh-CN';
  if(l.kind==='stroke'){ txt = l.title + '，' + (l.rhyme||''); }
  else if(l.kind==='radical'){ txt = l.title + '，' + (l.ex? '例字，' + l.ex.split('').join('，'):''); }
  else if(l.kind==='letter'){ txt = l.title.split(' ')[W.si] || l.title; lang='en-US'; }
  else { txt = (PY_SOUND[l.glyph]||l.glyph); }
  speak(txt, lang);
  bubble(l.kind==='letter'?'跟我读～':'听我读一遍～');
}

/* --- 载入一个阶段（大写/小写 或 唯一阶段） --- */
function loadStage(si, first){
  W.si = si;
  W.stage = W.l.stages[si];
  W.strokes = W.stage.strokes.map(s=>({d:s.d, ox:s.ox||0, done:false}));
  W.cur = 0;
  document.getElementById('lTitle').textContent = W.l.title;
  document.getElementById('lSub').textContent = (W.l.stages.length>1? W.stage.label + '　·　' : '') + W.l.sub;
  document.getElementById('tip').textContent =
    W.l.kind==='stroke' ? ('口诀：'+W.l.rhyme) :
    W.l.kind==='radical' ? (W.l.tip + (W.l.ex? '　例字：'+W.l.ex : '')) :
    W.l.kind==='pinyin' ? ('读音：' + (PY_SOUND[W.l.glyph]||'')) : '跟着小圆点，慢慢写';
  renderPad();
  if(first){ sayPrompt('enter'); bubble('小朋友，我们一起来写字吧～'); setTimeout(()=>playSound(), 1800); }
  else { bubble('再写一个～'); setTimeout(()=>playSound(), 400); }
}

function renderPad(){
  const pad=document.getElementById('pad');
  const st=W.stage;
  pad.setAttribute('viewBox', st.vb);
  pad.setAttribute('preserveAspectRatio','xMidYMid meet');
  const vb = st.vb.split(' ').map(Number);
  const [vx,vy,vw,vh]=vb;
  let html='';
  // 背景格：汉字用田字格，字母/拼音用四线三格
  const isHan = W.l.kind==='stroke'||W.l.kind==='radical';
  if(isHan){
    html += `<rect x="${vx+2}" y="${vy+2}" width="${vw-4}" height="${vh-4}" rx="8" fill="#fff" stroke="#E9EDF6" stroke-width="1.2"/>`;
    html += `<path d="M${vx+vw/2},${vy+4} L${vx+vw/2},${vy+vh-4} M${vx+4},${vy+vh/2} L${vx+vw-4},${vy+vh/2}" stroke="#E9EDF6" stroke-width="1" stroke-dasharray="6 6"/>`;
  } else {
    const top = vy+8, base = vy+vh-14, mid = (top+base)/2;
    html += `<path d="M${vx+4},${top} L${vx+vw-4},${top} M${vx+4},${mid} L${vx+vw-4},${mid} M${vx+4},${base} L${vx+vw-4},${base} M${vx+4},${base+10} L${vx+vw-4},${base+10}" stroke="#E9EDF6" stroke-width="1.1" stroke-dasharray="5 5"/>`;
  }
  // 引导轨迹层
  W.strokes.forEach((s,i)=>{
    const done = s.done, active = (i===W.cur);
    html += `<g transform="translate(${s.ox},0)">
      <path d="${s.d}" fill="none" stroke="${done?W.m.color:(active?'#D8DFEE':'#E9EDF6')}" stroke-width="${st.w}" stroke-linecap="round" stroke-linejoin="round"/>
      ${done? `<path d="${s.d}" fill="none" stroke="${W.m.color}" stroke-width="${st.w}" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    </g>`;
  });
  // 当前笔：起笔点 + 方向箭头
  const cur = W.strokes[W.cur];
  // 用户笔迹层 + 采样探针（探针必须在文档内，getTotalLength 才稳定）
  html += `<path id="ink" fill="none" stroke="${W.m.color}" stroke-width="${st.w*0.62}" stroke-linecap="round" stroke-linejoin="round" d=""/>`;
  html += `<path id="probe" fill="none" stroke="none" d="" visibility="hidden"/>`;
  pad.innerHTML = html;
  W.ink = pad.querySelector('#ink');
  W.probe = pad.querySelector('#probe');
  // 当前笔的起笔圆点与方向箭头（需在探针可用后计算）
  if(cur){
    const g=document.createElementNS(NS,'g');
    const p0=pointAt(cur.d,0,cur.ox), pm=pointAt(cur.d,0.55,cur.ox), pn=pointAt(cur.d,0.8,cur.ox);
    const ang=Math.atan2(pn.y-pm.y,pn.x-pm.x)*180/Math.PI;
    g.innerHTML =
      `<circle cx="${p0.x}" cy="${p0.y}" r="${st.w*0.30}" fill="#fff" stroke="${W.m.color}" stroke-width="${st.w*0.16}">
        <animate attributeName="r" values="${st.w*0.26};${st.w*0.40};${st.w*0.26}" dur="1.6s" repeatCount="indefinite"/></circle>
       <g transform="translate(${pm.x},${pm.y}) rotate(${ang})" opacity=".85"><path d="M-4,-4 L6,0 L-4,4 Z" fill="${W.m.color}"/></g>`;
    pad.insertBefore(g, W.ink);
  }
  renderDots();
}
function renderDots(){
  const box=document.getElementById('dots'); if(!box) return;
  box.innerHTML = W.strokes.map((s,i)=>`<div class="dot ${s.done?'ok':(i===W.cur?'on':'')}"></div>`).join('');
}

/* --- 采样与判定 --- */
function probeEl(){ return (W && W.probe) ? W.probe : document.getElementById('probe'); }
function pointAt(d, t, ox){
  const el=probeEl(); if(!el) return {x:0,y:0};
  el.setAttribute('d', d);
  const L=el.getTotalLength()||1;
  const p=el.getPointAtLength(L*Math.min(Math.max(t,0),1));
  return {x:p.x+(ox||0), y:p.y};
}
function sampleStroke(s){
  const _probeEl=probeEl(); if(!_probeEl) return [];
  _probeEl.setAttribute('d', s.d);
  const L=_probeEl.getTotalLength()||1;
  const n=Math.max(8, Math.min(46, Math.round(L/4.5)));
  const pts=[];
  for(let i=0;i<n;i++){ const p=_probeEl.getPointAtLength(L*i/(n-1)); pts.push({x:p.x+(s.ox||0), y:p.y}); }
  return pts;
}
function toSvg(e){
  const pad=document.getElementById('pad');
  const m=pad.getScreenCTM().inverse();
  const pt=pad.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const r=pt.matrixTransform(m); return {x:r.x,y:r.y};
}
function onDown(e){
  if(W.finished) return;
  ac();
  e.preventDefault();
  try{ document.getElementById('pad').setPointerCapture(e.pointerId); }catch(err){}
  const s=W.strokes[W.cur]; if(!s) return;
  W.samples = sampleStroke(s);
  W.covered = new Array(W.samples.length).fill(false);
  W.pts=[toSvg(e)]; W.out=0; W.hit=0;
  W.ink.setAttribute('d', `M${W.pts[0].x},${W.pts[0].y}`);
  SFX.write();
}
function onMove(e){
  if(!W.pts || W.pts.length===0) return;
  e.preventDefault();
  const p=toSvg(e);
  const last=W.pts[W.pts.length-1];
  if(Math.hypot(p.x-last.x,p.y-last.y) < 1.2) return;
  W.pts.push(p);
  W.ink.setAttribute('d', W.pts.map((q,i)=>(i?'L':'M')+q.x+','+q.y).join(' '));
  // 覆盖判定
  const TOL = Math.max(9, W.stage.w*0.95);
  let best=-1, bd=1e9;
  const S=W.samples;
  for(let i=0;i<S.length;i++){ const d=Math.hypot(p.x-S[i].x, p.y-S[i].y); if(d<bd){bd=d;best=i;} }
  if(bd<=TOL){ W.covered[best]=true; W.hit++; }
  if(bd>TOL*1.8) W.out++;
  if(W.hit>0 && W.hit%9===0) SFX.write();
}
function onUp(){
  if(!W.pts || W.pts.length===0) return;
  const cov = W.covered.filter(Boolean).length / W.covered.length;
  const outRatio = W.out / Math.max(1,W.pts.length);
  const ok = cov>=0.5 && outRatio<0.45;
  const near = !ok && cov>=0.34 && outRatio<0.55;
  W.pts=null;
  const s=W.strokes[W.cur];
  if(ok||near){
    s.done=true;
    flashStroke(s);
    W.cur++;
    SFX.correct();
    if(near){ sayPrompt('near'); bubble('很不错哦，继续加油！'); }
    else { sayPrompt('good'); bubble('哇！写得真棒！'); flyStar(); }
    renderPad();
    if(W.cur>=W.strokes.length){
      if(W.si+1 < W.l.stages.length){ setTimeout(()=>loadStage(W.si+1,false), 900); }
      else finishLevel();
    }
  } else {
    W.ink.setAttribute('d','');
    SFX.gentle(); sayPrompt('soft'); bubble('没关系，我们再试一次吧～');
  }
}
function flashStroke(s){
  const pad=document.getElementById('pad'); if(!pad||!s) return;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d', s.d); p.setAttribute('fill','none');
  p.setAttribute('stroke', W.m.color); p.setAttribute('stroke-width', W.stage.w*1.6);
  p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  p.setAttribute('transform','translate('+(s.ox||0)+',0)');
  p.setAttribute('opacity','0.45');
  const an=document.createElementNS(NS,'animate');
  an.setAttribute('attributeName','opacity'); an.setAttribute('values','0.45;0');
  an.setAttribute('dur','0.55s'); an.setAttribute('fill','freeze');
  p.appendChild(an); pad.insertBefore(p, W.ink);
  setTimeout(()=>p.remove(),700);
}
function flyStar(){
  const board=document.getElementById('board'); if(!board) return;
  const r=board.getBoundingClientRect();
  const el=document.createElement('div'); el.className='fly'; el.textContent='⭐';
  el.style.left=(r.left+r.width/2-15)+'px'; el.style.top=(r.top+r.height/2-15)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function resetStage(){
  W.strokes.forEach(s=>s.done=false); W.cur=0; W.finished=false;
  const ov=document.getElementById('ov'); if(ov) ov.classList.add('hide');
  renderPad(); SFX.rewrite(); bubble('我们再来一次～');
}

/* --- 通关 --- */
function finishLevel(){
  W.finished=true;
  SFX.pass(); SFX.star();
  const l=W.l;
  const first = !(SAVE.lv[l.id] && SAVE.lv[l.id].done);
  if(first){
    SAVE.stars += 1;
    SAVE.lv[l.id] = {done:true, stars:1, ts:Date.now()};
    const rec=todayRec(); rec.stars+=1;
    rec.list.push({t:new Date().toTimeString().slice(0,5), m:l.m, name:l.title});
    save();
  }
  const sn=document.getElementById('starNum'); if(sn) sn.textContent=SAVE.stars;
  sayPrompt('pass');
  const nx=nextLevel(l);
  const ov=document.getElementById('ov');
  ov.classList.remove('hide');
  ov.innerHTML=`<div class="win">
    <div class="pet" style="width:96px;height:96px;margin:0 auto">${pet(W.m.pet,96)}</div>
    <h2>${first?'太棒啦！':'又写对啦！'}</h2>
    <p>${first?'恭喜通关「'+l.title+'」':'这一关你已经会写啦'}</p>
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*0.12}s">⭐</span>`).join('')}</div>
    <div class="btns">
      ${nx? `<button class="bigbtn main" id="nextBtn">下一关：${nx.title} ›</button>`:''}
      <button class="bigbtn gray" id="againBtn">再练一次</button>
      <button class="bigbtn gray" id="homeBtn">回到地图</button>
    </div>
  </div>`;
  const n=document.getElementById('nextBtn');
  if(n) n.addEventListener('click',()=>{ SFX.click(); if(levelUnlocked(nx)) openWrite(nx); else renderLevels(l.m); });
  document.getElementById('againBtn').addEventListener('click',()=>{ SFX.rewrite(); ov.classList.add('hide'); W.finished=false; resetStage(); });
  document.getElementById('homeBtn').addEventListener('click',()=>{ SFX.click(); app.style.removeProperty('--acc'); renderLevels(l.m); });
}

/* ================= 家长页 ================= */
function renderParentGate(){
  const a=Math.floor(Math.random()*8)+2, b=Math.floor(Math.random()*8)+2, ans=a+b;
  const opts=[ans, ans+1, ans-1].sort(()=>Math.random()-0.5);
  go(`<div class="page">
    <div class="topbar"><button class="iconbtn" id="back">‹</button><div class="topTitle">家长入口</div></div>
    <div class="scroll" style="display:flex;align-items:center;justify-content:center">
      <div class="pcard qbox" style="width:100%;margin:24px 18px">
        <h3>请家长确认</h3>
        <p style="color:var(--sub);font-size:13px;margin:0">算一算下面的题目</p>
        <div class="q">${a} + ${b} = ?</div>
        <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>
      </div>
    </div>
  </div>`);
  document.getElementById('back').addEventListener('click',()=>{ SFX.click(); renderHome(); });
  app.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    SFX.click();
    if(+el.dataset.v===ans) renderParent(); else toast('答案不对，再试一次～');
  }));
}
function renderParent(){
  const rec=todayRec();
  const doneCount=Object.values(SAVE.lv).filter(v=>v.done).length;
  const days=Object.keys(SAVE.today).sort().reverse().slice(0,7);
  go(`<div class="page">
    <div class="topbar"><button class="iconbtn" id="back">‹</button><div class="topTitle">家长页</div></div>
    <div class="scroll">
      <div class="pcard" style="margin-top:6px">
        <h3>今日练习</h3>
        <div class="stat">
          <div><b>${rec.stars}</b><span>今日星星</span></div>
          <div><b>${rec.list.length}</b><span>今日关卡</span></div>
          <div><b>${SAVE.stars}</b><span>星星总数</span></div>
        </div>
      </div>
      <div class="pcard">
        <h3>今日练习记录</h3>
        ${rec.list.length? rec.list.slice().reverse().map(r=>`<div class="rec">
            <span style="color:${MODULES.find(m=>m.id===r.m).color}">●</span>
            <span>${MODULES.find(m=>m.id===r.m).name}　${r.name}</span>
            <span class="t">${r.t}</span></div>`).join('') : '<div class="empty">今天还没有练习，陪孩子写一笔吧～</div>'}
      </div>
      <div class="pcard">
        <h3>最近 7 天</h3>
        ${days.length? days.map(k=>`<div class="rec"><span>${k}</span><span style="color:var(--sub)">${SAVE.today[k].list.length} 关</span><span class="t">⭐ ${SAVE.today[k].stars}</span></div>`).join('') : '<div class="empty">暂无记录</div>'}
        <div style="font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6">
          已完成 ${doneCount} / ${LEVELS.length} 关　·　数据仅保存在本机，不上传任何信息
        </div>
      </div>
      <div class="pcard">
        <div class="toggleRow"><span>背景音乐</span><button class="sw ${SAVE.bgm?'on':''}" id="bgmSw"><i></i></button></div>
      </div>
      <div style="text-align:center;padding:0 0 26px">
        <button class="linkbtn" id="clearBtn">清空全部练习记录</button>
      </div>
    </div>
  </div>`);
  document.getElementById('back').addEventListener('click',()=>{ SFX.click(); renderHome(); });
  document.getElementById('bgmSw').addEventListener('click',e=>{
    SAVE.bgm=!SAVE.bgm; save(); e.currentTarget.classList.toggle('on',SAVE.bgm);
    if(SAVE.bgm) bgmStart(pendingBgm==='home'?'home':pendingBgm); else bgmStop();
  });
  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(confirm('确定清空全部练习记录和星星吗？此操作不可恢复。')){
      SAVE={stars:0,lv:{},today:{},bgm:SAVE.bgm}; save(); renderParent(); toast('已清空');
    }
  });
}

/* ---------------- 启动 ---------------- */
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
renderHome();
/* 首次交互后再启动音频（浏览器自动播放策略） */
window.addEventListener('pointerdown',()=>{ ac(); audioReady=true; bgmStart(pendingBgm); },{once:true});
</script>
